[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge"
version = "0.1.0"
description = "人在环中的数学建模 Agent 工作台 — 多智能体协作拆题、选模、求解、成文，每个关键决策由你拍板。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "nanfengjunhuai", email = "nanfengjunhuai@outlook.com" }]
keywords = ["agent", "llm", "math-modeling", "human-in-the-loop", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]

# 应用层依赖。
#
# 注意这里「没有」numpy/scipy/pandas/matplotlib —— 这不是遗漏，是刻意的架构约束：
# 沙箱执行层要跑 LLM 生成的任意代码，必须与后端进程使用「不同的」运行时环境。
# 沙箱环境见 scripts/setup_sandbox_env.sh（M3 阶段创建）。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.54",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
# 只收 modelforge 包，避免 setuptools 去扫描 web/node_modules 和 .venv
include = ["modelforge*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
