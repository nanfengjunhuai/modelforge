[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelforge"
version = "0.1.0"
description = "人在环中的数学建模 Agent 工作台 — 多智能体协作拆题、选模、求解、成文，每个关键决策由你拍板。"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "nanfengjunhuai", email = "nanfengjunhuai@outlook.com" }]
keywords = ["agent", "llm", "math-modeling", "human-in-the-loop", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
]

# 应用层依赖。
#
# 注意这里「没有」numpy/scipy/pandas/matplotlib —— 这不是遗漏，是刻意的架构约束：
# 沙箱执行层要跑 LLM 生成的任意代码，必须与后端进程使用「不同的」运行时环境。
# 沙箱环境见 scripts/setup_sandbox_env.sh（M3 阶段创建）。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "openai>=1.54",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
# 只收 modelforge 包，避免 setuptools 去扫描 web/node_modules 和 .venv
include = ["modelforge*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# RUF001/RUF002/RUF003 检测「易混淆的 Unicode 字符」，本意是防 homoglyph 攻击
# （例如用西里尔字母 а 冒充拉丁字母 a 来伪装标识符）。
# 但本项目的注释、文档字符串和面向用户的文案都是中文，全角标点会被它逐条误报，
# 噪音极大而零安全收益 —— 中文标点出现在注释里不构成 homoglyph 风险。
# 故关闭这三条，其余 RUF 规则保留。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
# ⚠️ 沙箱运行时目录**刻意排除在 mypy 之外**，这不是偷懒。
#
# `modelforge/sandbox/runtime/` 里的代码不在后端进程里跑 —— 它会被复制进
# 沙箱的临时工作目录，由 `.venv-sandbox` 的 python 执行。而那个环境里装的
# 是 numpy / matplotlib，后端 `.venv` 里**刻意没有**它们（ADR-005 的安全边界，
# 见上面 dependencies 的注释）。
#
# 所以拿后端的 mypy 去检查它必然报 "Cannot find implementation or library
# stub for module named 'matplotlib'" —— 这个报错**不说明任何真实问题**，
# 只说明「检查器站在了错误的环境里」。
#
# 它真正的验收方式是「在沙箱里真的跑一遍」，见 tests/test_matplotlib_style.py。
# 那条路径能抓到 mypy 抓不到的东西：M5 开发过程中它抓到过 numpy 数组被
# 误判成非法输入，以及 matplotlibrc 里 7 个静默失效的配置项 ——
# 后者一个类型检查器都抓不到，因为「配置写错了但程序照跑」根本不是类型问题。
#
# ruff 仍然检查这个文件（它只做语法和风格），所以不是完全无人看守。
exclude = ['^modelforge/sandbox/runtime/']


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
